services:
  node-express:
    build:
      context: ./apps/node-express
      dockerfile: Dockerfile
    container_name: failure-lab-node-express
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATA_DIR: /data
      ORDERS_URL: http://go-gin:8080
      GO_URL: http://go-gin:8080
      DOWNSTREAM_URL: http://python-fastapi:8000
    volumes:
      - labdata:/data
    depends_on:
      - go-gin
      - python-fastapi

  go-gin:
    build:
      context: ./apps/go-gin
      dockerfile: Dockerfile
    container_name: failure-lab-go-gin
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      PAYMENTS_URL: http://python-fastapi:8000
      PYTHON_URL: http://python-fastapi:8000
      DOWNSTREAM_URL: http://node-express:3000

  python-fastapi:
    build:
      context: ./apps/python-fastapi
      dockerfile: Dockerfile
    container_name: failure-lab-python-fastapi
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      GO_URL: http://go-gin:8080
      DOWNSTREAM_URL: http://go-gin:8080

  nextjs-15:
    build:
      context: ./apps/nextjs-15
      dockerfile: Dockerfile
    container_name: failure-lab-nextjs-15
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production

volumes:
  labdata:
